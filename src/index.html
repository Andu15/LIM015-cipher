<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Caesar Cipher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root">
      <main class="card">
        <h1>Cifrado César</h1>

        <label for="operationSelect">Operación a realizar:</label>
        <select id="operationSelect">
            <option value="move">1. Mover valor</option>
            <option value="ascii">2. Código ASCII</option>
            <option value="cipher">3. Cifrar</option>
        </select>

        <label for="translateText">Ingresa el texto:</label>
        <input type="text" id="translateText" name="translateText" placeholder="Escribe el texto a cifrar...">

        <label for="shift">Desplazamiento:</label>
        <input type="number" id="shift" name="shift" placeholder="Ej: 3" min="1" max="25">

        <button id="encodeBtn">Ejecutar Operación</button>

        <label for="resultText">Resultado:</label>
        <input type="text" id="resultText" name="resultText" readonly placeholder="Aquí aparecerá el resultado">
      </main>
    </div>

    <script src="index.js" type="module"></script>
  </body>
</html>
