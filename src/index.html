<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Caesar Cipher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root">
      <main class="card">
        <h1>Cifrado César</h1>

        <label for="translateText">Ingresa el texto:</label>
        <input type="text" id="translateText" placeholder="Escribe el texto a cifrar...">

        <label for="shift">Desplazamiento:</label>
        <input type="number" id="shift" placeholder="Ej: 3">

        <button id="encodeBtn">Codificar</button>

        <label for="resultText">Resultado:</label>
        <input type="text" id="resultText" readonly placeholder="Aquí aparecerá el resultado">
      </main>
    </div>

    <script src="index.js" type="module"></script>
  </body>
</html>
